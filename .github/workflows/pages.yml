name: Publicar no GitHub Pages
on:
  push:
    branches: [ccr-6ea18242-j8j9ie, main, master]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Montar site (sem a pasta original/ e sem ferramentas)
        run: |
          mkdir _site
          cp -r index.html css js lib assets .nojekyll README.md _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
